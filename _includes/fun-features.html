<style>
/* ── Gradient mesh background ────────────────────────────────────────── */
.mesh-bg {
  position: fixed; inset: 0;
  pointer-events: none; z-index: -1; overflow: hidden;
}
.mesh-blob {
  position: absolute; border-radius: 50%;
  filter: blur(90px);
}
.mesh-blob-1 {
  width: 560px; height: 560px;
  background: radial-gradient(circle, rgba(13,148,136,0.09) 0%, transparent 70%);
  top: -120px; left: -80px;
  animation: mb1 28s ease-in-out infinite alternate;
}
.mesh-blob-2 {
  width: 430px; height: 430px;
  background: radial-gradient(circle, rgba(45,212,191,0.07) 0%, transparent 70%);
  top: 35%; right: -100px;
  animation: mb2 22s ease-in-out infinite alternate;
}
.mesh-blob-3 {
  width: 380px; height: 380px;
  background: radial-gradient(circle, rgba(13,148,136,0.06) 0%, transparent 70%);
  bottom: -60px; left: 25%;
  animation: mb3 32s ease-in-out infinite alternate;
}
.mesh-blob-4 {
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(45,212,191,0.05) 0%, transparent 70%);
  top: 60%; left: 5%;
  animation: mb4 18s ease-in-out infinite alternate;
}
@keyframes mb1 { from { transform:translate(0,0) scale(1); }    to { transform:translate(180px,130px) scale(1.15); } }
@keyframes mb2 { from { transform:translate(0,0) scale(1); }    to { transform:translate(-130px,90px) scale(0.9); } }
@keyframes mb3 { from { transform:translate(0,0) scale(1); }    to { transform:translate(80px,-110px) scale(1.1); } }
@keyframes mb4 { from { transform:translate(0,0) scale(1); }    to { transform:translate(120px,-60px) scale(1.2); } }
html[data-theme='dark'] .mesh-blob-1 { background: radial-gradient(circle, rgba(13,148,136,0.13) 0%, transparent 70%); }
html[data-theme='dark'] .mesh-blob-2 { background: radial-gradient(circle, rgba(45,212,191,0.10) 0%, transparent 70%); }
html[data-theme='dark'] .mesh-blob-3 { background: radial-gradient(circle, rgba(13,148,136,0.09) 0%, transparent 70%); }

/* ── Click ripple ────────────────────────────────────────────────────── */
.click-ripple {
  position: fixed; border-radius: 50%;
  width: 60px; height: 60px;
  background: rgba(13,148,136,0.2);
  pointer-events: none; transform: scale(0);
  animation: ripple-go 0.55s ease-out forwards;
  z-index: 8000;
}
@keyframes ripple-go { to { transform: scale(5); opacity: 0; } }

/* ── Toast ───────────────────────────────────────────────────────────── */
.ff-toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #1e293b; color: #2dd4bf;
  font-size: 0.8rem; font-weight: 500;
  padding: 8px 20px; border-radius: 20px;
  border: 1px solid #1a5c56;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  opacity: 0; transition: opacity 0.3s, transform 0.3s;
  z-index: 9998; white-space: nowrap; pointer-events: none;
}
.ff-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Matrix rain ─────────────────────────────────────────────────────── */
#matrix-canvas { position:fixed; inset:0; z-index:9990; pointer-events:none; display:none; }
#matrix-exit {
  position:fixed; top:18px; right:18px; z-index:9991;
  background:rgba(0,0,0,0.78); color:#2dd4bf;
  border:1px solid #2dd4bf; border-radius:6px;
  padding:5px 14px; font-size:0.78rem; cursor:pointer; display:none;
  font-family:'Courier New',monospace; letter-spacing:0.5px;
}
</style>

<div class="mesh-bg" aria-hidden="true">
  <div class="mesh-blob mesh-blob-1"></div>
  <div class="mesh-blob mesh-blob-2"></div>
  <div class="mesh-blob mesh-blob-3"></div>
  <div class="mesh-blob mesh-blob-4"></div>
</div>

<canvas id="matrix-canvas"></canvas>
<button id="matrix-exit">✕ exit matrix</button>

<script>
(function () {

  /* ── Click ripple ── */
  document.addEventListener('click', function (e) {
    if (e.target.closest('#terminal-overlay') || e.target.closest('#matrix-exit')) return;
    var r = document.createElement('div');
    r.className = 'click-ripple';
    r.style.left = (e.clientX - 30) + 'px';
    r.style.top  = (e.clientY - 30) + 'px';
    document.body.appendChild(r);
    setTimeout(function () { r.remove(); }, 600);
  });

  /* ── Toast helper ── */
  function showToast(msg) {
    var t = document.createElement('div');
    t.className = 'ff-toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add('show'); }, 10);
    setTimeout(function () {
      t.classList.remove('show');
      setTimeout(function () { t.remove(); }, 400);
    }, 2600);
  }
  window._ffToast = showToast;

  /* ── Email click → copy ── */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="mailto:"]');
    if (!a || !navigator.clipboard) return;
    var email = a.getAttribute('href').replace('mailto:', '');
    e.preventDefault();
    navigator.clipboard.writeText(email).then(function () {
      showToast('✓  ' + email + '  copied to clipboard');
    });
  });

  /* ── Konami code → Matrix rain ── */
  var SEQ = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown',
             'ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  var idx = 0, running = false, raf;
  var canvas  = document.getElementById('matrix-canvas');
  var exitBtn = document.getElementById('matrix-exit');
  var ctx     = canvas.getContext('2d');
  var CHARS   = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF'.split('');

  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === SEQ[idx]) { idx++; } else { idx = (e.key === SEQ[0]) ? 1 : 0; }
    if (idx === SEQ.length) { idx = 0; running ? stopMatrix() : startMatrix(); }
  });

  function startMatrix() {
    running = true;
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.style.display  = 'block';
    exitBtn.style.display = 'block';
    var cols  = Math.floor(canvas.width / 16);
    var drops = Array(cols).fill(1);
    function draw() {
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = '14px Courier New';
      for (var i = 0; i < drops.length; i++) {
        var ch = CHARS[Math.floor(Math.random() * CHARS.length)];
        ctx.fillStyle = Math.random() > 0.96 ? '#ffffff' : (Math.random() > 0.4 ? '#2dd4bf' : '#0d9488');
        ctx.fillText(ch, i * 16, drops[i] * 16);
        if (drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      raf = requestAnimationFrame(draw);
    }
    draw();
    showToast('🟩 konami code unlocked: matrix mode');
  }

  function stopMatrix() {
    running = false;
    cancelAnimationFrame(raf);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvas.style.display  = 'none';
    exitBtn.style.display = 'none';
  }

  exitBtn.addEventListener('click', stopMatrix);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && running) stopMatrix();
  });

})();
</script>
